# golangci-lint configuration for POS Backend
# Documentation: https://golangci-lint.run/usage/configuration/

run:
  timeout: 5m
  tests: true
  skip-dirs:
    - vendor
    - bin
    - .github
  modules-download-mode: readonly

output:
  format: colored-line-number
  print-issued-lines: true
  print-linter-name: true
  sort-results: true

linters:
  enable:
    # Default linters
    - errcheck      # Check for unchecked errors
    - gosimple      # Simplify code
    - govet         # Vet examines Go source code
    - ineffassign   # Detect ineffectual assignments
    - staticcheck   # Advanced Go linter
    - typecheck     # Type checker
    - unused        # Check for unused code

    # Additional recommended linters
    - gofmt         # Check code formatting
    - goimports     # Check import formatting
    - misspell      # Find commonly misspelled words
    - revive        # Fast, configurable, extensible linter
    - gosec         # Security-focused linter
    - unconvert     # Remove unnecessary type conversions
    - unparam       # Find unused function parameters
    - goconst       # Find repeated strings that could be constants
    - gocyclo       # Check cyclomatic complexity
    - dupl          # Check for code duplication
    - gocritic      # Opinionated linter with many checks
    - bodyclose     # Check HTTP response body closed
    - noctx         # Find HTTP requests without context.Context
    - sqlclosecheck # Check SQL rows/statements closed
    - rowserrcheck  # Check SQL rows errors

  disable:
    - lll           # Line length (too strict for tests)
    - funlen        # Function length (too strict)
    - gocognit      # Cognitive complexity (duplicate of gocyclo)

linters-settings:
  errcheck:
    check-type-assertions: true
    check-blank: true

  govet:
    check-shadowing: true
    enable-all: true

  revive:
    severity: warning
    rules:
      - name: var-naming
        severity: warning
      - name: package-comments
        severity: warning
      - name: exported
        severity: warning
      - name: error-return
        severity: error
      - name: error-naming
        severity: warning
      - name: if-return
        severity: warning
      - name: var-declaration
        severity: warning
      - name: receiver-naming
        severity: warning

  gosec:
    severity: medium
    confidence: medium
    excludes:
      - G104  # Audit errors not checked (covered by errcheck)
      - G304  # File path from variable (too many false positives in tests)

  gocyclo:
    min-complexity: 15

  dupl:
    threshold: 100

  goconst:
    min-len: 3
    min-occurrences: 3

  misspell:
    locale: US

  unused:
    check-exported: false

  unparam:
    check-exported: false

  gocritic:
    enabled-tags:
      - diagnostic
      - performance
      - style
    disabled-checks:
      - hugeParam  # Too strict for some cases

issues:
  exclude-rules:
    # Exclude some linters from running on tests files
    - path: _test\.go
      linters:
        - gocyclo
        - dupl
        - gosec
        - goconst

    # Exclude known false positives
    - text: "G404: Use of weak random number generator"
      linters:
        - gosec

    # Exclude shadow checking on the variable named err
    - text: "shadow: declaration of \"err\" shadows declaration"
      linters:
        - govet

    # Exclude certain staticcheck checks
    - text: "SA1019:"  # Deprecated warnings
      linters:
        - staticcheck

  max-issues-per-linter: 0
  max-same-issues: 0
  new: false

severity:
  default-severity: warning
  rules:
    - linters:
        - errcheck
        - govet
        - staticcheck
        - gosec
      severity: error
