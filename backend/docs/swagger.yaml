openapi: 3.0.3
info:
  title: POS Backend API
  description: |
    Complete Point of Sale and Accounting System API

    ## Features
    - Multi-tenant architecture with organization isolation
    - Complete double-entry accounting
    - Configurable posting engine
    - Real-time inventory management
    - Customer and vendor management
    - Sales and purchase processing
    - Financial reporting

    ## Authentication
    All API endpoints (except /health and /auth/*) require Bearer token authentication.

    Include the token in the Authorization header:
    ```
    Authorization: Bearer <your_token_here>
    ```

    ## Rate Limiting
    - Standard endpoints: 100 requests/minute per IP
    - Auth endpoints: 10 requests/minute per IP
    - Burst allowance: 150 requests/minute

    ## Multi-tenancy
    All API requests are scoped to an organization. The organization_id is typically
    part of the URL path: `/api/v1/organizations/{organization_id}/...`

    ## Error Responses
    All errors follow a consistent format:
    ```json
    {
      "error": "Error message description",
      "code": "ERROR_CODE",
      "details": {}
    }
    ```

    Common HTTP status codes:
    - 200: Success
    - 201: Created
    - 400: Bad Request (validation errors)
    - 401: Unauthorized (missing or invalid token)
    - 403: Forbidden (insufficient permissions)
    - 404: Not Found
    - 422: Unprocessable Entity (business rule violation)
    - 429: Too Many Requests (rate limit exceeded)
    - 500: Internal Server Error

  version: 1.0.0
  contact:
    name: API Support
    email: support@example.com
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://localhost:8080/api/v1
    description: Local development server
  - url: https://api-staging.example.com/api/v1
    description: Staging server
  - url: https://api.example.com/api/v1
    description: Production server

tags:
  - name: Health
    description: Health check and system status endpoints
  - name: Authentication
    description: User registration, login, and token management
  - name: Organizations
    description: Organization management endpoints
  - name: Users
    description: User management endpoints
  - name: Products
    description: Product and inventory management
  - name: Customers
    description: Customer management
  - name: Vendors
    description: Vendor/supplier management
  - name: Sales
    description: Sales transaction processing
  - name: Purchases
    description: Purchase order and receipt management
  - name: Invoices
    description: Customer invoice management
  - name: Bills
    description: Vendor bill management
  - name: Payments
    description: Payment processing
  - name: Chart of Accounts
    description: Accounting chart of accounts management
  - name: Journal Entries
    description: Manual journal entry management
  - name: General Ledger
    description: General ledger queries
  - name: Posting Configuration
    description: Posting engine configuration
  - name: Reports
    description: Financial and operational reports
  - name: Admin
    description: Administrative endpoints (admin only)
  - name: Jobs
    description: Background job management

paths:
  /health:
    get:
      tags:
        - Health
      summary: Health check
      description: Returns the health status of the API server
      operationId: healthCheck
      responses:
        '200':
          description: Server is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  timestamp:
                    type: string
                    format: date-time
                  version:
                    type: string
                    example: 1.0.0

  /auth/register:
    post:
      tags:
        - Authentication
      summary: Register new user
      description: Creates a new user account and organization
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
                - name
              properties:
                email:
                  type: string
                  format: email
                  example: user@example.com
                password:
                  type: string
                  format: password
                  minLength: 8
                  example: SecurePass123!
                name:
                  type: string
                  example: John Doe
                organization_name:
                  type: string
                  example: My Company Inc
      responses:
        '201':
          description: User created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  user_id:
                    type: string
                    format: uuid
                  organization_id:
                    type: string
                    format: uuid
                  token:
                    type: string
                    description: JWT authentication token
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/ValidationError'

  /auth/login:
    post:
      tags:
        - Authentication
      summary: User login
      description: Authenticates a user and returns a JWT token
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                  user_id:
                    type: string
                    format: uuid
                  organization_id:
                    type: string
                    format: uuid
                  expires_at:
                    type: string
                    format: date-time
        '401':
          $ref: '#/components/responses/Unauthorized'

  /organizations/{organization_id}/products:
    get:
      tags:
        - Products
      summary: List products
      description: Returns a paginated list of products for the organization
      operationId: listProducts
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - name: search
          in: query
          description: Search by product name or SKU
          schema:
            type: string
        - name: category
          in: query
          description: Filter by category
          schema:
            type: string
      responses:
        '200':
          description: Product list retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Product'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

    post:
      tags:
        - Products
      summary: Create product
      description: Creates a new product in the inventory
      operationId: createProduct
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductInput'
      responses:
        '201':
          description: Product created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token obtained from /auth/login

  parameters:
    OrganizationId:
      name: organization_id
      in: path
      required: true
      description: Organization UUID
      schema:
        type: string
        format: uuid

    Page:
      name: page
      in: query
      description: Page number (1-indexed)
      schema:
        type: integer
        minimum: 1
        default: 1

    Limit:
      name: limit
      in: query
      description: Number of items per page
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

  schemas:
    Product:
      type: object
      properties:
        id:
          type: string
          format: uuid
        organization_id:
          type: string
          format: uuid
        name:
          type: string
        sku:
          type: string
        description:
          type: string
        category:
          type: string
        unit_price:
          type: number
          format: decimal
        cost_price:
          type: number
          format: decimal
        quantity_on_hand:
          type: integer
        reorder_level:
          type: integer
        track_inventory:
          type: boolean
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ProductInput:
      type: object
      required:
        - name
        - unit_price
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        sku:
          type: string
          maxLength: 50
        description:
          type: string
        category:
          type: string
        unit_price:
          type: number
          format: decimal
          minimum: 0
        cost_price:
          type: number
          format: decimal
          minimum: 0
        reorder_level:
          type: integer
          minimum: 0
        track_inventory:
          type: boolean
          default: true

    Pagination:
      type: object
      properties:
        page:
          type: integer
        limit:
          type: integer
        total_pages:
          type: integer
        total_items:
          type: integer
        has_next:
          type: boolean
        has_prev:
          type: boolean

    Error:
      type: object
      properties:
        error:
          type: string
          description: Human-readable error message
        code:
          type: string
          description: Machine-readable error code
        details:
          type: object
          description: Additional error details
          additionalProperties: true

  responses:
    BadRequest:
      description: Bad request - invalid input
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Invalid request parameters
            code: BAD_REQUEST
            details: {}

    Unauthorized:
      description: Unauthorized - missing or invalid authentication token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Authentication required
            code: UNAUTHORIZED
            details: {}

    Forbidden:
      description: Forbidden - insufficient permissions
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Insufficient permissions
            code: FORBIDDEN
            details: {}

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Resource not found
            code: NOT_FOUND
            details: {}

    ValidationError:
      description: Validation error - business rule violation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Validation failed
            code: VALIDATION_ERROR
            details:
              field: email
              message: Email already exists

    RateLimitExceeded:
      description: Too many requests
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Rate limit exceeded
            code: RATE_LIMIT_EXCEEDED
            details:
              retry_after: 60

    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: An unexpected error occurred
            code: INTERNAL_SERVER_ERROR
            details: {}
