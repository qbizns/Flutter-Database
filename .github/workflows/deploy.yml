name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        type: choice
        options:
          - staging
          - production
      version:
        description: 'Version/tag to deploy (e.g., v1.0.0 or main)'
        required: true
        type: string

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    name: Deploy to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.version }}

      - name: Set up environment variables
        run: |
          if [ "${{ inputs.environment }}" = "production" ]; then
            echo "SERVER_HOST=${{ secrets.PROD_SERVER_HOST }}" >> $GITHUB_ENV
            echo "SERVER_USER=${{ secrets.PROD_SERVER_USER }}" >> $GITHUB_ENV
            echo "DEPLOY_PATH=${{ secrets.PROD_DEPLOY_PATH }}" >> $GITHUB_ENV
          else
            echo "SERVER_HOST=${{ secrets.STAGING_SERVER_HOST }}" >> $GITHUB_ENV
            echo "SERVER_USER=${{ secrets.STAGING_SERVER_USER }}" >> $GITHUB_ENV
            echo "DEPLOY_PATH=${{ secrets.STAGING_DEPLOY_PATH }}" >> $GITHUB_ENV
          fi

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ env.SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to server
        env:
          VERSION: ${{ inputs.version }}
        run: |
          ssh -i ~/.ssh/deploy_key ${{ env.SERVER_USER }}@${{ env.SERVER_HOST }} << 'EOF'
            set -e

            # Navigate to deployment directory
            cd ${{ env.DEPLOY_PATH }}

            # Pull latest code
            git fetch --all --tags
            git checkout ${{ env.VERSION }}
            git pull origin ${{ env.VERSION }} || true

            # Backup database
            ./scripts/backup.sh

            # Pull latest Docker images
            docker-compose pull

            # Run database migrations
            docker-compose run --rm backend /app/migrate -cmd up

            # Deploy with zero downtime
            docker-compose up -d --no-deps --build

            # Wait for health check
            sleep 10

            # Check health
            curl -f http://localhost:8080/health || exit 1

            # Clean up old images
            docker image prune -f

            echo "✅ Deployment completed successfully"
          EOF

      - name: Run smoke tests
        run: |
          # Wait for deployment to settle
          sleep 30

          # Run basic smoke tests
          if [ "${{ inputs.environment }}" = "production" ]; then
            BASE_URL="https://api.example.com"
          else
            BASE_URL="https://api-staging.example.com"
          fi

          # Health check
          curl -f $BASE_URL/health || exit 1

          # Metrics endpoint
          curl -f $BASE_URL/metrics || exit 1

          echo "✅ Smoke tests passed"

      - name: Notify deployment
        if: always()
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          text: |
            Deployment to ${{ inputs.environment }} ${{ job.status }}
            Version: ${{ inputs.version }}
            Deployed by: ${{ github.actor }}
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}

      - name: Create deployment record
        uses: chrnorm/deployment-action@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          environment: ${{ inputs.environment }}
          ref: ${{ inputs.version }}

  rollback:
    name: Rollback (if needed)
    runs-on: ubuntu-latest
    needs: [deploy]
    if: failure()
    environment: ${{ inputs.environment }}

    steps:
      - name: Trigger rollback
        run: |
          echo "❌ Deployment failed. Manual rollback may be required."
          echo "To rollback, run: ./scripts/rollback.sh"
